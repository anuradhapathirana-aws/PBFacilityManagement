# Nginx site for planbfacilitymanagement.com → Node app on 127.0.0.1:4000
# Install:  sudo cp deploy/nginx-planb.conf /etc/nginx/sites-available/planb
#           sudo ln -s /etc/nginx/sites-available/planb /etc/nginx/sites-enabled/planb
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS is added afterwards by:  sudo certbot --nginx -d planbfacilitymanagement.com -d www.planbfacilitymanagement.com
# If PORT in server/.env is not 4000, change the proxy_pass port below to match.

server {
    listen 80;
    listen [::]:80;
    server_name planbfacilitymanagement.com www.planbfacilitymanagement.com;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
