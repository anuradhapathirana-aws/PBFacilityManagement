# TEMPORARY public demo before the domain exists: http://SERVER_IP:8080 → Plan B (127.0.0.1:4000)
# Listens ONLY on port 8080, so it cannot affect sites on ports 80/443.
#
# Install:  sudo cp deploy/nginx-planbfm-demo.conf /etc/nginx/sites-available/planbfm-demo
#           sudo ln -s /etc/nginx/sites-available/planbfm-demo /etc/nginx/sites-enabled/planbfm-demo
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo ufw allow 8080/tcp
# Remove (once the real domain + HTTPS work):
#           sudo rm /etc/nginx/sites-enabled/planbfm-demo && sudo nginx -t && sudo systemctl reload nginx
#           sudo ufw delete allow 8080/tcp

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
