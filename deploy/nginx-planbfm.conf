# Nginx site for planbfacilitymanagement.com → Node app on 127.0.0.1:4000
# Install:  sudo cp deploy/nginx-planbfm.conf /etc/nginx/sites-available/planbfacilitymanagement.com
#           sudo ln -s /etc/nginx/sites-available/planbfacilitymanagement.com /etc/nginx/sites-enabled/planbfacilitymanagement.com
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS is added afterwards by:  sudo certbot --nginx -d planbfacilitymanagement.com -d www.planbfacilitymanagement.com
# If PORT in server/.env is not 4000, change the proxy_pass port below to match.

server {
    listen 80;
    listen [::]:80;
    server_name planbfacilitymanagement.com www.planbfacilitymanagement.com;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Behind Cloudflare: take the visitor's real IP from CF-Connecting-IP, but only when the request
    # really comes from Cloudflare (list: https://www.cloudflare.com/ips/). Applies to this site only.
    # Without this, every visitor looks like a Cloudflare IP and the login rate limit is shared by all.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only the (real) client IP — never pass on a client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
