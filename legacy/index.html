<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleaningOS | Booking Manager</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e9f3fb;background:#08121e}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#101f2d;border-right:1px solid #294258;padding:24px 15px}.logo{font-weight:900;font-size:24px;color:#53dfb1;margin:0 10px 22px}.nav{width:100%;text-align:left;padding:12px 14px;border:0;background:transparent;color:#c8d8e5;border-radius:9px;margin-bottom:5px}.nav.active,.nav:hover{background:#1d4050;color:#fff}.main{padding:25px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#9fb4c5}.panel{background:#112332;border:1px solid #294258;border-radius:15px;padding:19px;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#142b3b;border:1px solid #2b4657;border-radius:12px;padding:16px}.stat strong{display:block;font-size:25px;color:#6de5c0}.stat span{color:#a6c0d0;font-size:13px}.btn{background:#28b98c;color:#061b19;border:0;border-radius:9px;padding:10px 16px;font-weight:750}.btn.secondary{background:#29475b;color:#eaf5ff}.btn.danger{background:#773943;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:#bdd1df}.field input,.field select,.field textarea,.search{background:#091a27;border:1px solid #355166;color:white;border-radius:8px;padding:11px;width:100%}.field textarea{min-height:68px}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #294258;font-size:13px}th{color:#9bb9c9}td{vertical-align:middle}.tablewrap{overflow:auto}.tag{border-radius:30px;padding:5px 9px;background:#284c5b;color:#d1f5f0;font-size:12px;white-space:nowrap}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.scrollstaff{height:210px;overflow-y:auto;border:1px solid #345366;background:#0b1a27;border-radius:10px;padding:6px}.staffitem{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #20394a;cursor:pointer}.staffitem input{width:18px;height:18px;accent-color:#28b98c}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#254b54;border-radius:20px;padding:6px 9px;font-size:12px}.notice{border:1px solid #9c7940;background:#44391e;padding:10px;border-radius:9px;color:#ffe1a3}.good{color:#62e1b1}.bad{color:#ffaaa5}.hidden{display:none!important}h1{margin:0;font-size:27px}h2{margin:0 0 12px;font-size:19px}h3{margin:12px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}small{color:#9cb8c9}hr{border:0;border-top:1px solid #294258;margin:16px 0}@media(max-width:850px){.shell{display:block}.side{padding:12px;position:sticky;top:0;z-index:3}.logo{margin:0 0 8px;font-size:19px}.navbox{display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto;padding:8px}.main{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}h1{font-size:22px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.stat strong{font-size:20px}}
@media print{.side,.top button,.btn{display:none!important}.shell{display:block}.main{max-width:none;padding:0}.panel{break-inside:avoid}body{background:white;color:black}.panel,.stat{background:white;color:black;border-color:#bbb}.stat strong,.muted,th{color:#333}} </style></head><body><div class="shell"><aside class="side"><div class="logo">✦ CleaningOS</div><div class="navbox" id="nav"></div><p class="muted" style="font-size:11px;margin:20px 12px">Offline demo • Saves to this browser only</p></aside><main class="main"><div class="top"><div><h1 id="heading">Dashboard</h1><div class="muted" id="subheading">Cleaning company operations</div></div><div class="row"><button class="btn secondary" onclick="exportData()">Export Backup</button><button class="btn" onclick="go('new')">+ New Booking</button></div></div><div id="view"></div></main></div>
<script>
'use strict';const KEY='cleaningos_rebuilt_v1';const initial={staff:[{id:'S1',name:'Nimal',role:'Cleaner',phone:''},{id:'S2',name:'Kamal',role:'Cleaner',phone:''},{id:'S3',name:'Ayesha',role:'Cleaner',phone:''},{id:'S4',name:'Fathima',role:'Cleaner',phone:''},{id:'S5',name:'Ruwan',role:'Cleaner',phone:''},{id:'D1',name:'Sameer',role:'Driver',phone:''}],bookings:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)};db.staff=Array.isArray(db.staff)?db.staff:[];db.bookings=Array.isArray(db.bookings)?db.bookings:[];let page='dashboard',editId=null,selected=[],staffSearch='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cleaners=()=>db.staff.filter(s=>s.role==='Cleaner'),drivers=()=>db.staff.filter(s=>s.role==='Driver');const money=n=>'AED '+Number(n||0).toFixed(2);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Browser storage unavailable. Export a backup before closing.')}};const label=id=>db.staff.find(s=>s.id===id)?.name||'Unknown';const fmt=b=>new Date(b.date+'T'+b.time).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});const total=b=>Number(b.cleanerCount)*Number(b.hours)*Number(b.rate);const options=(items,current)=>items.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');
const menus=[['dashboard','Dashboard'],['daily','Daily Bookings'],['bookings','Bookings'],['new','New Booking'],['staff','Staff'],['cleaner','Cleaner View'],['driver','Driver View'],['payments','Payments'],['reports','Reports']];function go(p,id=null){page=p;editId=id;staffSearch='';render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=menus.map(([id,n])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('heading').textContent=menus.find(x=>x[0]===page)?.[1]||'CleaningOS';$('subheading').textContent=page==='new'?'Create or update a customer booking':'Own cleaning company • local prototype';const views={dashboard,daily:dailyBookings,bookings,new:bookingForm,staff:staffView,cleaner:cleanerView,driver:driverView,payments:paymentsView,reports};$('view').innerHTML=views[page]();if(page==='new'){const b=db.bookings.find(x=>x.id===editId);selected=[...(b?.cleanerIds||[])];refreshStaff();updateEstimate()}}
function dashboard(){const today=localToday();const booked=db.bookings.filter(b=>b.date===today);return `<div class="cards" style="margin-top:18px"><div class="stat"><strong>${db.bookings.length}</strong><span>Total bookings</span></div><div class="stat"><strong>${booked.length}</strong><span>Today bookings</span></div><div class="stat"><strong>${db.bookings.filter(b=>b.status==='Pending').length}</strong><span>Pending</span></div><div class="stat"><strong>${money(db.bookings.filter(b=>b.payment==='Paid').reduce((a,b)=>a+total(b),0))}</strong><span>Recorded paid revenue</span></div></div><div class="panel"><div class="spread"><h2>Upcoming / Recent Bookings</h2><button class="btn secondary" onclick="chosenDailyDate=localToday();go('daily')">View Today / Choose Date</button></div>${bookingTable([...db.bookings].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,8))}</div><div class="panel"><h2>How to use</h2><p class="muted">Add staff → create booking → tick multiple cleaners in scrollable list → assign driver → save → update status and payment. Demo staff names can be changed in Staff.</p></div>`}
function bookingTable(items){if(!items.length)return '<p class="muted">No bookings yet. Create your first booking.</p>';return `<div class="tablewrap"><table><thead><tr><th>Booking</th><th>Customer</th><th>Date / Area</th><th>Cleaners</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(b=>`<tr><td>${esc(b.id)}</td><td><b>${esc(b.customer)}</b><br><small>${esc(b.phone)}</small></td><td>${esc(fmt(b))}<br><small>${esc(b.area)}</small></td><td>${(b.cleanerIds||[]).map(id=>esc(label(id))).join(', ')||'<span class="bad">Unassigned</span>'}</td><td>${money(total(b))}</td><td><span class="tag">${esc(b.status)}</span></td><td><div class="actions"><button class="btn secondary" onclick="go('new','${b.id}')">Manage</button><button class="btn danger" onclick="removeBooking('${b.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
let chosenDailyDate=localToday();
function dailyBookings(){const items=db.bookings.filter(b=>b.date===chosenDailyDate).sort((a,b)=>a.time.localeCompare(b.time));const active=items.filter(b=>b.status!=='Cancelled');return `<div class="panel"><div class="spread"><div><h2>Bookings by Date</h2><p class="muted">Select any date to see every booking scheduled for that day.</p></div><button class="btn secondary" onclick="setDailyDate(localToday())">Today</button></div><div class="field" style="max-width:320px"><label>Select Booking Date</label><input type="date" id="dailyDate" value="${esc(chosenDailyDate)}" onchange="setDailyDate(this.value)"></div><div class="cards"><div class="stat"><strong>${items.length}</strong><span>Bookings on selected date</span></div><div class="stat"><strong>${active.length}</strong><span>Non-cancelled bookings</span></div><div class="stat"><strong>${active.reduce((n,b)=>n+Number(b.cleanerCount||0),0)}</strong><span>Cleaner assignments</span></div><div class="stat"><strong>${money(active.reduce((n,b)=>n+total(b),0))}</strong><span>Scheduled booking value</span></div></div><h2 style="margin-top:20px">All Bookings — ${esc(chosenDailyDate)}</h2>${items.length?bookingTable(items):'<p class="muted">No bookings found for this date.</p>'}</div>`}
function setDailyDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;chosenDailyDate=date;render()}
function bookings(){return `<div class="panel"><div class="spread"><h2>All Customer Bookings</h2><input class="search" style="max-width:280px" placeholder="Search customer / booking / area" oninput="filterBookingRows(this.value)"></div><div id="bookingrows">${bookingTable(db.bookings)}</div></div>`}function filterBookingRows(q){$('bookingrows').innerHTML=bookingTable(db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone+' '+b.area).toLowerCase().includes(q.toLowerCase())))}function removeBooking(id){if(confirm('Delete this booking permanently from this browser?')){db.bookings=db.bookings.filter(b=>b.id!==id);save();render()}}
function bookingForm(){const b=db.bookings.find(x=>x.id===editId)||{customer:'',phone:'',area:'Ajman',address:'',service:'Standard Home Cleaning',date:new Date().toLocaleDateString('en-CA'),time:'09:00',hours:3,rate:35,cleanerCount:3,cleanerIds:[],driverId:'',status:'Pending',payment:'Unpaid',notes:''};return `<div class="panel"><h2>${editId?'Manage Booking '+esc(editId):'Create New Booking'}</h2><form id="bookingform" onsubmit="submitBooking(event)"><div class="grid"><div><div class="field"><label>Customer name *</label><input name="customer" required maxlength="100" value="${esc(b.customer)}"></div><div class="field"><label>Phone *</label><input name="phone" required maxlength="25" value="${esc(b.phone)}"></div><div class="field"><label>Area *</label><select name="area">${options(['Ajman','Sharjah','Dubai','Umm Al Quwain','Other'],b.area)}</select></div><div class="field"><label>Full address</label><textarea name="address">${esc(b.address)}</textarea></div><div class="field"><label>Service</label><select name="service">${options(['Standard Home Cleaning','Deep Cleaning','Villa Cleaning','Office Cleaning','Move In / Move Out'],b.service)}</select></div><div class="grid"><div class="field"><label>Date *</label><input type="date" name="date" required value="${esc(b.date)}"></div><div class="field"><label>Time *</label><input type="time" name="time" required value="${esc(b.time)}"></div></div></div><div><div class="grid"><div class="field"><label>Number of cleaners *</label><input type="number" name="cleanerCount" min="1" max="100" required value="${b.cleanerCount}" oninput="updateEstimate()"></div><div class="field"><label>Hours *</label><input type="number" name="hours" min="0.5" step="0.5" max="48" required value="${b.hours}" oninput="updateEstimate()"></div></div><div class="field"><label>Hourly rate per cleaner (AED) *</label><input type="number" name="rate" min="0" step="0.01" required value="${b.rate}" oninput="updateEstimate()"></div><div class="stat" style="margin-bottom:13px"><span>Estimated booking total</span><strong id="estimate">${money(total(b))}</strong><small>Cleaners × hours × hourly rate (excludes other fees / tax)</small></div><div class="field"><label>Search cleaners (scroll list and tick multiple)</label><input id="staffsearch" placeholder="Type staff name" oninput="staffSearch=this.value;refreshStaff()"></div><div class="scrollstaff" id="stafflist"></div><div class="spread" style="margin-top:9px"><strong id="selectedcount">0 selected</strong><button type="button" class="btn secondary" onclick="selected=[];refreshStaff()">Clear</button></div><div class="chips" id="selectedchips"></div><div class="field" style="margin-top:15px"><label>Driver (optional)</label><select name="driverId"><option value="">No driver assigned</option>${drivers().map(s=>`<option value="${esc(s.id)}" ${b.driverId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div></div><div class="grid"><div class="field"><label>Booking status</label><select name="status">${options(['Pending','Confirmed','Assigned','On the Way','In Progress','Completed','Cancelled'],b.status)}</select></div><div class="field"><label>Payment status</label><select name="payment">${options(['Unpaid','Partial','Paid'],b.payment)}</select></div></div><div class="field"><label>Special instructions</label><textarea name="notes">${esc(b.notes)}</textarea></div><div id="conflicts"></div><div class="row"><button type="submit" class="btn">${editId?'Save Booking Changes':'Save Booking'}</button><button type="button" class="btn secondary" onclick="go('bookings')">Cancel</button></div></form></div>`}
function refreshStaff(){if(!$('stafflist'))return;const filtered=cleaners().filter(s=>s.name.toLowerCase().includes(staffSearch.toLowerCase()));$('stafflist').innerHTML=filtered.length?filtered.map(s=>`<label class="staffitem"><input type="checkbox" ${selected.includes(s.id)?'checked':''} onchange="toggleStaff('${s.id}',this.checked)"><span>${esc(s.name)}</span><small>${esc(s.phone)}</small></label>`).join(''):'<p class="muted">No matching cleaners. Add cleaners from Staff page.</p>';$('selectedcount').textContent=selected.length+' cleaner(s) selected';$('selectedchips').innerHTML=selected.map(id=>`<span class="chip">${esc(label(id))} <button type="button" style="background:none;color:white;border:0" onclick="toggleStaff('${id}',false)">×</button></span>`).join('')}
function toggleStaff(id,checked){selected=checked?[...new Set([...selected,id])]:selected.filter(x=>x!==id);refreshStaff()}function updateEstimate(){const f=$('bookingform');if(!f)return;const v=Number(f.elements.cleanerCount.value)*Number(f.elements.hours.value)*Number(f.elements.rate.value);$('estimate').textContent=money(v)}function overlaps(a,b){const startA=new Date(a.date+'T'+a.time).getTime(),startB=new Date(b.date+'T'+b.time).getTime();return startA<startB+Number(b.hours)*3600000&&startB<startA+Number(a.hours)*3600000}function submitBooking(e){e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f).entries());data.cleanerCount=Number(data.cleanerCount);data.hours=Number(data.hours);data.rate=Number(data.rate);data.cleanerIds=[...selected];if(selected.length!==data.cleanerCount){alert('Please select exactly '+data.cleanerCount+' cleaners. Selected: '+selected.length);return}if(!data.date||!data.time||!data.customer.trim()||!data.phone.trim()){alert('Fill all required fields');return}const collision=db.bookings.filter(b=>b.id!==editId&&b.status!=='Cancelled'&&overlaps(data,b)).flatMap(b=>{const people=data.cleanerIds.filter(id=>(b.cleanerIds||[]).includes(id));if(data.driverId&&b.driverId===data.driverId)people.push(data.driverId);return people.map(id=>`${label(id)} (${b.id})`)});if(collision.length){$('conflicts').innerHTML='<p class="notice">Schedule conflict: '+esc(collision.join(', '))+'</p>';alert('Cannot save: assigned staff/driver already booked at this time.');return}if(editId){const i=db.bookings.findIndex(b=>b.id===editId);db.bookings[i]={...db.bookings[i],...data}}else{data.id='BK-'+Date.now().toString(36).toUpperCase();data.createdAt=new Date().toISOString();db.bookings.push(data)}save();alert('Booking saved in this browser.');go('bookings')}
function staffView(){return `<div class="panel"><h2>Add Cleaner or Driver</h2><form class="grid" onsubmit="addStaff(event)"><div class="field"><label>Staff name *</label><input name="name" required maxlength="100" placeholder="Full name"></div><div class="field"><label>Phone</label><input name="phone" placeholder="+971..."></div><div class="field"><label>Role</label><select name="role"><option>Cleaner</option><option>Driver</option></select></div><div style="align-self:end;margin-bottom:12px"><button class="btn" type="submit">+ Add Staff</button></div></form></div><div class="panel"><h2>Staff Directory (${db.staff.length})</h2><div class="tablewrap"><table><tr><th>Name</th><th>Role</th><th>Phone</th><th>Action</th></tr>${db.staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${esc(s.phone)}</td><td><button class="btn danger" onclick="deleteStaff('${s.id}')">Remove</button></td></tr>`).join('')}</table></div></div>`}function addStaff(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());db.staff.push({...d,id:'S'+Date.now().toString(36)});save();render()}function deleteStaff(id){if(db.bookings.some(b=>(b.cleanerIds||[]).includes(id)||b.driverId===id)){alert('This staff member is assigned to a booking. Reassign them first.');return}if(confirm('Remove this staff member?')){db.staff=db.staff.filter(s=>s.id!==id);save();render()}}
function cleanerView(){return `<div class="panel"><h2>Cleaner Job View</h2><div class="field"><label>Select cleaner</label><select id="viewer" onchange="showCleanerJobs(this.value)"><option value="">Choose cleaner</option>${cleaners().map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div><div id="jobview"><p class="muted">Choose a cleaner to see assigned customer bookings.</p></div></div>`}function showCleanerJobs(id){$('jobview').innerHTML=bookingTable(db.bookings.filter(b=>(b.cleanerIds||[]).includes(id)))}function driverView(){return `<div class="panel"><h2>Driver Trip View</h2><div class="field"><label>Select driver</label><select onchange="showDriverJobs(this.value)"><option value="">Choose driver</option>${drivers().map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div><div id="driverjobs"><p class="muted">Choose a driver to see pickup/drop-off jobs.</p></div></div>`}function showDriverJobs(id){$('driverjobs').innerHTML=bookingTable(db.bookings.filter(b=>b.driverId===id))}function paymentsView(){return `<div class="panel"><h2>Payments</h2><p class="muted">Change payment status from Manage Booking.</p><div class="tablewrap"><table><tr><th>Booking</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Action</th></tr>${db.bookings.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.customer)}</td><td>${money(total(b))}</td><td><span class="tag">${esc(b.payment)}</span></td><td><button class="btn secondary" onclick="go('new','${b.id}')">Manage</button></td></tr>`).join('')}</table></div></div>`}let reportDate=localToday(),reportCleaner='all';
function setReportDate(v){if(/^\d{4}-\d{2}-\d{2}$/.test(v)){reportDate=v;render()}}
function reportRows(){return db.bookings.filter(b=>b.date===reportDate)}
function cleanerShare(b,id){
  // Equal-share allocation in AED cents. Distribute remainder deterministically
  // so individual rounded shares always add up to the full booking value.
  const ids=[...new Set(b.cleanerIds||[])].sort();
  const index=ids.indexOf(id);
  if(index<0||!ids.length)return 0;
  const cents=Math.round(total(b)*100);
  const base=Math.floor(cents/ids.length);
  const remainder=cents-base*ids.length;
  return (base+(index<remainder?1:0))/100;
}
function setReportCleaner(id){reportCleaner=id;render()}
function reportStats(){const all=reportRows(),valid=all.filter(b=>b.status!=='Cancelled'),done=valid.filter(b=>b.status==='Completed');const cleanerCounts=cleaners().map(s=>({name:s.name,id:s.id,assigned:valid.filter(b=>(b.cleanerIds||[]).includes(s.id)).length,completed:done.filter(b=>(b.cleanerIds||[]).includes(s.id)).length,hours:done.reduce((n,b)=>n+((b.cleanerIds||[]).includes(s.id)?Number(b.hours):0),0),assignedValue:valid.reduce((n,b)=>n+cleanerShare(b,s.id),0),completedValue:done.reduce((n,b)=>n+cleanerShare(b,s.id),0)}));const driverCounts=drivers().map(s=>({name:s.name,id:s.id,assigned:valid.filter(b=>b.driverId===s.id).length,completed:done.filter(b=>b.driverId===s.id).length}));return {all,valid,done,cleanerCounts,driverCounts,value:valid.reduce((n,b)=>n+total(b),0),completedValue:done.reduce((n,b)=>n+total(b),0),paid:valid.filter(b=>b.payment==='Paid').reduce((n,b)=>n+total(b),0),unpaid:valid.filter(b=>b.payment==='Unpaid').reduce((n,b)=>n+total(b),0),partial:valid.filter(b=>b.payment==='Partial').reduce((n,b)=>n+total(b),0)}}
function reports(){const r=reportStats();const counts=st=>r.all.filter(b=>b.status===st).length;return `<div class="panel"><div class="spread"><div><h2>Daily Operations & Final Report</h2><p class="muted">Choose a date to see bookings, cleaner workload, driver assignments and financial summaries.</p></div><div class="row"><button class="btn secondary" onclick="setReportDate(localToday())">Today</button><button class="btn secondary" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="exportReportCSV()">Export CSV</button></div></div><div class="field" style="max-width:320px"><label>Report Date</label><input type="date" value="${esc(reportDate)}" onchange="setReportDate(this.value)"></div><div class="cards"><div class="stat"><strong>${r.all.length}</strong><span>Total bookings</span></div><div class="stat"><strong>${r.done.length}</strong><span>Completed bookings</span></div><div class="stat"><strong>${counts('Pending')}</strong><span>Pending</span></div><div class="stat"><strong>${counts('Cancelled')}</strong><span>Cancelled</span></div><div class="stat"><strong>${money(r.value)}</strong><span>Non-cancelled booked value</span></div><div class="stat"><strong>${money(r.completedValue)}</strong><span>Completed job value</span></div><div class="stat"><strong>${money(r.paid)}</strong><span>Bookings marked Paid</span></div><div class="stat"><strong>${money(r.unpaid)}</strong><span>Bookings marked Unpaid</span></div></div></div><div class="panel"><h2>Cleaner-wise Work Report — Equal Share</h2><div class="tablewrap"><table><thead><tr><th>Cleaner</th><th>Assigned jobs</th><th>Completed jobs</th><th>Completed job hours</th><th>Assigned value (AED)</th><th>Completed value (AED)</th><th>Details</th></tr></thead><tbody>${r.cleanerCounts.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.assigned}</td><td>${s.completed}</td><td>${s.hours}</td><td>${money(s.assignedValue)}</td><td>${money(s.completedValue)}</td><td><button class="btn secondary" onclick="setReportCleaner('${s.id}')">View jobs</button></td></tr>`).join('')}</tbody></table></div><p class="muted">A booking assigned to three cleaners counts as one job for each cleaner. Hours use scheduled booking duration, not actual clock-in/out time. Per-cleaner amounts use Equal Share: booking total divided among assigned cleaners, with cent rounding reconciled so all shares add to the booking total. These are not wages.</p></div><div class="panel"><div class="spread"><h2>Individual Cleaner Job & Amount Details</h2><div class="field"><label>Choose Cleaner</label><select onchange="setReportCleaner(this.value)"><option value="all" ${reportCleaner==='all'?'selected':''}>All cleaners</option>${cleaners().map(s=>`<option value="${esc(s.id)}" ${reportCleaner===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div></div><p class="muted">Equal Share mode is active. Amount is each cleaner's equal share of the customer booking value, NOT staff wages or salary. For example, AED 300 shared across 3 assigned cleaners = AED 100 each. Only Completed jobs count toward completed value.</p><div class="tablewrap"><table><thead><tr><th>Cleaner</th><th>Booking</th><th>Customer</th><th>Status</th><th>Hours</th><th>Full booking AED</th><th>Cleaner share AED</th></tr></thead><tbody>${r.valid.filter(b=>reportCleaner==='all'||(b.cleanerIds||[]).includes(reportCleaner)).flatMap(b=>(b.cleanerIds||[]).filter(id=>reportCleaner==='all'||id===reportCleaner).map(id=>`<tr><td>${esc(label(id))}</td><td>${esc(b.id)}</td><td>${esc(b.customer)}</td><td>${esc(b.status)}</td><td>${Number(b.hours)}</td><td>${money(total(b))}</td><td>${money(cleanerShare(b,id))}</td></tr>`)).join('')||'<tr><td colspan="7">No jobs for this cleaner on selected date.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Driver-wise Assignment Report</h2><div class="tablewrap"><table><thead><tr><th>Driver</th><th>Assigned bookings</th><th>Bookings completed</th></tr></thead><tbody>${r.driverCounts.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.assigned}</td><td>${s.completed}</td></tr>`).join('')}</tbody></table></div><p class="muted">These are booking-based driver assignments, NOT verified trips or pickup/drop-off counts. Actual trip tracking requires separate driver trip records.</p></div><div class="panel"><h2>Payments & Booking Status</h2><p>Partial-payment bookings: <b>${r.valid.filter(b=>b.payment==='Partial').length}</b> (full booking value ${money(r.partial)}; received amount unknown).</p><p>In Progress: <b>${counts('In Progress')}</b> • Confirmed: <b>${counts('Confirmed')}</b> • Assigned: <b>${counts('Assigned')}</b> • On the Way: <b>${counts('On the Way')}</b></p><p class="muted">Revenue values are estimates based on booking price and status, not verified cash receipts. Expenses, refunds, VAT, actual trip counts and payment amounts are not yet recorded.</p></div><div class="panel"><h2>Bookings on ${esc(reportDate)}</h2>${bookingTable(r.all.sort((a,b)=>a.time.localeCompare(b.time)))}</div>`}
function exportReportCSV(){const r=reportStats(),rows=[['CleaningOS daily report',reportDate],[],['Metric','Value'],['Total bookings',r.all.length],['Completed bookings',r.done.length],['Booked value AED',r.value],['Completed value AED',r.completedValue],['Paid bookings value AED',r.paid],[],['Cleaner','Assigned jobs','Completed jobs','Scheduled hours for completed jobs','Assigned value AED','Completed value AED'],...r.cleanerCounts.map(x=>[x.name,x.assigned,x.completed,x.hours,x.assignedValue.toFixed(2),x.completedValue.toFixed(2)]),[],['Individual cleaner job allocations: equal share of booking revenue; not salary'],['Cleaner','Booking ID','Customer','Status','Hours','Booking value AED','Cleaner share AED'],...r.valid.flatMap(b=>(b.cleanerIds||[]).map(id=>[label(id),b.id,b.customer,b.status,b.hours,total(b).toFixed(2),cleanerShare(b,id).toFixed(2)])),[],['Driver','Assigned bookings','Completed bookings'],...r.driverCounts.map(x=>[x.name,x.assigned,x.completed]),[],['Booking ID','Customer','Time','Status','Cleaners','Driver','Value AED','Payment'],...r.all.map(b=>[b.id,b.customer,b.time,b.status,(b.cleanerIds||[]).map(label).join('; '),label(b.driverId||''),total(b),b.payment])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='CleaningOS_Daily_Report_'+reportDate+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cleaningos-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
